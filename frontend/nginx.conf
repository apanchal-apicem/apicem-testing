server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React Router owns every non-file path client-side (e.g. /dashboards/executive_overview,
    # /assistant) -- without this fallback, a direct visit or a browser refresh on any route
    # other than "/" 404s, since there's no actual file at that path on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite fingerprints filenames) are safe to cache hard; index.html
    # itself must never be cached, or a redeploy won't reach anyone with an old copy.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
