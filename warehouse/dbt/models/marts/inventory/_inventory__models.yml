version: 2

models:
  - name: fct_inventory_snapshot
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - date_key
            - product_key
    columns:
      - name: tenant_id
        tests:
          - not_null
      - name: quantity_on_hand
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                severity: warn
