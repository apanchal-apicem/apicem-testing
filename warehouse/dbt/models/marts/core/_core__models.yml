version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique
      - name: tenant_id
        tests:
          - not_null

  - name: dim_product
    columns:
      - name: product_key
        tests:
          - not_null
          - unique

  - name: fct_orders
    columns:
      - name: order_key
        tests:
          - not_null
          - unique
      - name: tenant_id
        tests:
          - not_null
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key
              config:
                severity: warn
      - name: net_revenue
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -100000
              max_value: 1000000
              config:
                severity: warn
      - name: refund_amount
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                severity: warn

  - name: fct_order_items
    columns:
      - name: order_item_key
        tests:
          - not_null
          - unique

  - name: fct_revenue_daily
    columns:
      - name: tenant_id
        tests:
          - not_null
      - name: gross_revenue
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                severity: warn
