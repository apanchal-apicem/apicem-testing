version: 2

models:
  - name: dim_campaign
    columns:
      - name: campaign_key
        tests:
          - not_null
          - unique
      - name: tenant_id
        tests:
          - not_null

  - name: fct_ad_spend
    columns:
      - name: spend_key
        tests:
          - not_null
          - unique
      - name: tenant_id
        tests:
          - not_null
      - name: spend
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                severity: warn
