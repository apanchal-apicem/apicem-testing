version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apicem}
      POSTGRES_USER: ${POSTGRES_USER:-apicem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apicem_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./warehouse/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apicem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  orchestrator:
    build: ./orchestrator
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./orchestrator:/orchestrator
      - ./connectors:/connectors
      - ./warehouse/dbt:/dbt

  frontend:
    # A production build now (nginx serving a static bundle), not the Vite dev server -- so
    # VITE_API_BASE_URL has to be a build arg (baked into the JS at build time) rather than a
    # runtime `environment:` entry, and there's no source bind-mount anymore since there's no
    # dev server here to hot-reload against.
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
